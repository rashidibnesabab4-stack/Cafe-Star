<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Star - Best Burger In Town | Barisal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0b0b; color: #ffffff; overflow-x: hidden; }
        
        /* Premium Header / Navbar */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(11, 11, 11, 0.95); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 159, 67, 0.15); backdrop-filter: blur(10px); }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-badge { background: #ff9f43; color: #0b0b0b; padding: 5px 10px; font-weight: 900; font-size: 14px; border-radius: 4px; font-family: 'Playfair Display', serif; }
        .logo-text-group { display: flex; flex-direction: column; }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: #ff9f43; line-height: 1; }
        .logo-slogan { font-size: 9px; color: #ffffff; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; font-weight: 700; }
        
        .nav-links { list-style: none; display: flex; gap: 30px; align-items: center; }
        .nav-links a { color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { color: #ff9f43; }
        
        .btn { padding: 12px 26px; border-radius: 50px; font-weight: 700; text-decoration: none; font-size: 14px; transition: 0.4s ease; display: inline-block; text-align: center; }
        .btn-primary { background-color: #ff9f43; color: #0b0b0b; border: 2px solid #ff9f43; }
        .btn-primary:hover { background-color: transparent; color: #ff9f43; transform: translateY(-3px); }
        .btn-secondary { border: 2px solid #ffffff; color: #ffffff; }
        .btn-secondary:hover { background-color: #ffffff; color: #0b0b0b; transform: translateY(-3px); }

        /* Hero Section Layout */
        .hero { min-height: 100vh; display: flex; align-items: center; padding: 140px 8% 60px 8%; gap: 60px; position: relative; background: radial-gradient(circle at 80% 50%, rgba(255, 159, 67, 0.08), transparent 50%); }
        .hero-content { flex: 1.2; z-index: 2; }
        .time-tag { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; background: rgba(255, 159, 67, 0.07); border: 1px solid rgba(255, 159, 67, 0.4); border-radius: 50px; color: #ff9f43; font-weight: 700; font-size: 12px; margin-bottom: 25px; }
        .hero-content h1 { font-family: 'Playfair Display', serif; font-size: 56px; line-height: 1.1; margin-bottom: 25px; font-weight: 900; }
        .hero-content h1 span { color: #ff9f43; }
        .hero-content p { font-size: 16px; color: #cccccc; line-height: 1.7; margin-bottom: 35px; }
        .btn-wrapper { display: flex; gap: 20px; }
        
        /* Master High-Contrast Burger Image Graphic Replacement */
        .hero-image-wrapper { flex: 1; display: flex; justify-content: center; z-index: 2; position: relative; }
        .burger-graphic { width: 350px; height: 350px; background: radial-gradient(circle, #ff9f43 0%, transparent 70%); border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: floatGraphic 5s ease-in-out infinite; box-shadow: 0 0 50px rgba(255,159,67,0.2); }
        .burger-graphic i { font-size: 140px; color: #ffffff; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        @keyframes floatGraphic { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-20px) scale(1.03); } }

        /* Dynamic Menu System & Tabs */
        .menu-section { padding: 100px 8%; background-color: #101010; }
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-header h2 { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 900; margin-bottom: 10px; }
        .section-header h2 span { color: #ff9f43; }
        .section-header p { color: #666; font-size: 13px; letter-spacing: 1px; }
        
        .menu-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 45px; }
        .tab-btn { padding: 10px 18px; background: #161616; border: 1px solid rgba(255,159,67,0.2); color: #fff; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 13px; }
        .tab-btn.active, .tab-btn:hover { background: #ff9f43; color: #0b0b0b; font-weight: 700; border-color: #ff9f43; }

        .menu-container { display: none; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .menu-container.active-grid { display: grid; }
        
        .menu-card { background: #161616; border-radius: 15px; padding: 25px; border: 1px solid rgba(255,255,255,0.02); transition: 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-card:hover { transform: translateY(-5px); border-color: rgba(255, 159, 67, 0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .menu-icon-box { height: 120px; background: #1d1d1d; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: #ff9f43; font-size: 45px; }
        .menu-card h3 { font-family: 'Playfair Display', serif; font-size: 19px; margin-bottom: 10px; color: #ffffff; }
        .menu-card p { font-size: 13px; color: #999; line-height: 1.5; margin-bottom: 20px; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .price { font-size: 18px; font-weight: 900; color: #ff9f43; }

        /* Verified Operational Amenities Section */
        .amenities-section { padding: 80px 8%; background: #131313; border-top: 1px solid rgba(255,159,67,0.05); }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; }
        .info-box { background: #1c1c1c; padding: 25px; border-radius: 12px; border-bottom: 3px solid #ff9f43; }
        .info-box h4 { font-family: 'Playfair Display', serif; color: #ff9f43; margin-bottom: 15px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .info-box ul { list-style: none; }
        .info-box ul li { font-size: 13px; color: #ccc; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .info-box ul li i { color: #ff9f43; font-size: 11px; }

        /* Google Maps Component Box */
        .map-section { padding: 80px 8%; background: #101010; text-align: center; }
        .map-wrapper { width: 100%; max-width: 1000px; margin: 0 auto; border-radius: 15px; overflow: hidden; border: 2px solid rgba(255,159,67,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.6); height: 400px; }
        .map-wrapper iframe { width: 100%; height: 100%; border: 0; }

        /* Verified Reviews Box */
        .review-section { padding: 100px 8%; background: #0b0b0b; }
        .reviews-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 35px; }
        .review-card { background: #121212; padding: 35px; border-radius: 20px; border-top: 4px solid #ff9f43; }
        .stars { color: #ff9f43; margin-bottom: 15px; }
        .review-card p { font-style: italic; color: #d0d0d0; line-height: 1.6; margin-bottom: 20px; font-size: 14px; }
        .review-author { font-weight: 700; color: #ffffff; font-size: 14px; }
        .review-meta { font-size: 11px; color: #666; margin-top: 4px; }

        /* Footer */
        footer { background: #050505; padding: 60px 8% 30px 8%; border-top: 1px solid rgba(255, 159, 67, 0.15); text-align: center; }
        .footer-info { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 30px; margin-bottom: 40px; text-align: left; }
        .info-block h4 { font-family: 'Playfair Display', serif; color: #ff9f43; font-size: 18px; margin-bottom: 15px; }
        .info-block p { color: #999; font-size: 14px; line-height: 1.6; }
        .info-block a { color: #ff9f43; text-decoration: none; }
        .copy-tag { font-size: 13px; color: #444; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 25px; }

        @media (max-width: 968px) {
            .hero { flex-direction: column-reverse; text-align: center; padding-top: 120px; }
            .hero-content h1 { font-size: 34px; }
            .btn-wrapper { justify-content: center; }
            .burger-graphic { width: 260px; height: 260px; }
            .burger-graphic i { font-size: 100px; }
            .footer-info { flex-direction: column; text-align: center; }
        }
    </style>
</head>

            <div class="logo-badge">Cafe</div>

                <div class="logo-text">STAR</div>

            </div>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#menu">Our Menu</a></li>

            <li><a href="#location">Find Us</a></li>
            <li><a href="#reviews">Reviews</a></li>
        </ul>
        <a href="#location" class="btn btn-primary" style="padding: 10px 22px; font-size: 13px;">Book Table</a>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
